services:
  kakaotalk:
    build:
      context: .
    image: kakaotalk-wine:local
    container_name: kakaotalk-wine
    shm_size: "1gb"
    ports:
      - "127.0.0.1:14500:14500"
    volumes:
      - kakao-wine-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14500/vnc.html"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      WINEPREFIX: /data/wineprefix
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8

volumes:
  kakao-wine-data:
