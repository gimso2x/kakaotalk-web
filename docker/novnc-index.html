<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KakaoTalk Web</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fee500;
      color: #191919;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #191919;
    }
    p {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    a {
      color: #3b1e1e;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #fee500;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 1.5rem auto 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      const currentParams = new URLSearchParams(window.location.search);
      if (!currentParams.has('autoconnect')) currentParams.set('autoconnect', 'true');
      if (!currentParams.has('resize')) currentParams.set('resize', 'scale');
      const target = 'vnc.html?' + currentParams.toString();
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>KakaoTalk Web</h1>
    <p>카카오톡 원격 화면으로 자동 연결 중입니다...<br>잠시만 기다려 주세요.</p>
    <div class="spinner"></div>
    <p style="margin-top: 1.5rem; font-size: 0.85rem;">
      자동으로 이동하지 않으면 <a href="vnc.html?autoconnect=true&resize=scale">여기를 클릭하세요</a>.
    </p>
  </div>
</body>
</html>
